name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source files found."

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name arrange_teacher .

      - name: Set Arabic app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="تمارين الترتيب"|' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Ensure permissions, TTS query and minSdk after create
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" $M || sed -i "0,/<application/s|<application|<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <application|" $M
          grep -q "TTS_SERVICE" $M || sed -i 's|</manifest>|    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>|' $M
          for G in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$G" ] && sed -i -e 's/minSdk = flutter.minSdkVersion/minSdk = 24/' -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$G" || true
          done
          grep -n 'RECORD_AUDIO\|TTS_SERVICE' $M
          grep -n 'minSdk' android/app/build.gradle* || true

      - name: Verify Android Gradle files
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android Gradle files found."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrange-teacher-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
